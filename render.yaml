services:
  - type: web
    name: creatorhub-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://creatorhub-frontend.onrender.com

  - type: static
    name: creatorhub-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://creatorhub-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
